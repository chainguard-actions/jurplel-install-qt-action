name: Test invalid host fails
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Ensure python3 + pip are available
        run: |
          SUDO="$(command -v sudo || true)"
          if ! python3 -m pip --version; then
            $SUDO apt-get update && $SUDO apt-get install -y python3-pip
          fi
          echo "PIP_BREAK_SYSTEM_PACKAGES=1" >> "$GITHUB_ENV"
      - id: qt
        uses: .
        continue-on-error: true
        with:
          dir: ${{ runner.temp }}/qtbadhost
          version: "6.5.3"
          host: solaris
          install-deps: "false"
      - name: Assert action failed
        env:
          OUTCOME: ${{ steps.qt.outcome }}
          ROOT: ${{ steps.qt.outputs.qt-root-dir }}
        run: |
          echo "outcome=$OUTCOME root='$ROOT'"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure for invalid host"
            exit 1
          fi
          [ -z "$ROOT" ] || { echo "FAIL: no outputs expected"; exit 1; }
          echo "PASS"
