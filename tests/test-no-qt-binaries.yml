name: Test no-qt-binaries mode
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      RUNNER_WORKSPACE: /tmp/qt-workspace
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with no-qt-binaries
        id: action
        uses: .
        with:
          version: "6.8.3"
          target: desktop
          dir: /tmp/qt-workspace/Qt
          no-qt-binaries: "true"
          set-env: "true"
          install-deps: "false"
          setup-python: "true"

      - name: Assert action completed without error
        run: |
          echo "Action completed successfully (no-qt-binaries mode)"
          echo "PASS"
