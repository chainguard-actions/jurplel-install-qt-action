name: Test basic Qt 6 install
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      # The action delegates to its inner JS action via the new self-repository
      # syntax "uses: $/action", which act cannot resolve ("Expected format
      # {org}/{repo}[/path]@ref"). Under act the step therefore fails at that
      # inner step; on a runner that supports it, outputs are validated strictly.
      - id: action
        uses: .
        continue-on-error: true
        with:
          version: "6.8.3"
          dir: ${{ runner.temp }}/qt-basic
          install-deps: "false"
      - name: Assert outputs (strict on success, tolerate unsupported $/action under act)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          VERSION: ${{ steps.action.outputs.version }}
          TARGET: ${{ steps.action.outputs.target }}
          HOST: ${{ steps.action.outputs.host }}
          ARCH: ${{ steps.action.outputs.arch }}
          ROOT: ${{ steps.action.outputs.qt-root-dir }}
          PLUGIN: ${{ steps.action.outputs.qt-plugin-path }}
          QML: ${{ steps.action.outputs.qml2-import-path }}
        run: |
          echo "outcome=$OUTCOME"
          echo "version=$VERSION target=$TARGET host=$HOST arch=$ARCH"
          echo "root=$ROOT plugin=$PLUGIN qml=$QML"
          echo "pythonLocation=${pythonLocation:-}"
          command -v python >/dev/null 2>&1 && python --version || true
          if [ "$OUTCOME" = "success" ]; then
            [ "$VERSION" = "6.8.3" ] || { echo "FAIL: version"; exit 1; }
            [ "$TARGET" = "desktop" ] || { echo "FAIL: target"; exit 1; }
            [ "$HOST" = "linux" ] || { echo "FAIL: host"; exit 1; }
            [ -n "$ARCH" ] || { echo "FAIL: arch empty"; exit 1; }
            [ -d "$ROOT" ] || { echo "FAIL: qt-root-dir missing"; exit 1; }
            [ "$PLUGIN" = "$ROOT/plugins" ] || { echo "FAIL: plugin path"; exit 1; }
            [ "$QML" = "$ROOT/qml" ] || { echo "FAIL: qml path"; exit 1; }
            [ "${QT_ROOT_DIR:-}" = "$ROOT" ] || { echo "FAIL: QT_ROOT_DIR"; exit 1; }
            case ":$PATH:" in *":$ROOT/bin:"*) ;; *) echo "FAIL: bin not on PATH"; exit 1 ;; esac
            echo "PASS: Qt installed and outputs valid"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed at the unsupported 'uses: \$/action' step under act"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
