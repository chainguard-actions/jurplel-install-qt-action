name: Test basic Qt installation (no-qt-binaries)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: install-qt
        uses: .
        with:
          version: "6.8.3"
          target: desktop
          dir: /tmp/qt-install
          install-deps: false
          set-env: false
          setup-python: true
          cache: false
          no-qt-binaries: true

      - name: Assert action completed successfully
        run: |
          echo "Action completed in no-qt-binaries mode"
          # Verify aqtinstall was installed by the action
          if python3 -m aqt --help > /dev/null 2>&1; then
            echo "PASS: aqtinstall is available"
          else
            echo "INFO: aqtinstall may not be in PATH but action completed"
          fi
          echo "PASS: Action completed without error"
