name: Test tools-only install
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          no-qt-binaries: "true"
          tools: tools_ninja
          dir: ${{ runner.temp }}/qt-tools
          install-deps: "false"
      - name: Assert outcome
        env:
          OUTCOME: ${{ steps.action.outcome }}
          TOOLS_DIR: ${{ runner.temp }}/qt-tools/Qt/Tools
        run: |
          echo "outcome=$OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            [ -d "$TOOLS_DIR" ] || { echo "FAIL: tools dir missing"; exit 1; }
            echo "PASS"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed at the unsupported 'uses: \$/action' step under act"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
