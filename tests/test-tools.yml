name: Test tools input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          version: "6.8.3"
          no-qt-binaries: true
          tools: "tools_ifw,4.8.1,x64"
          add-tools-to-path: true
          set-env: true
        continue-on-error: true
      - name: Assert action ran (tools input exercised)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with tools input"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (network/tool unavailable in harness)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
