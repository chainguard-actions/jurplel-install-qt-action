name: Test tools input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          no-qt-binaries: true
          tools: tools_ifw,4.8,qt.tools.ifw.48
          add-tools-to-path: true
          set-env: false
        continue-on-error: true
      - name: Assert action ran with tools input
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran with tools input"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
