name: Test aqtsource input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          version: "6.8.3"
          no-qt-binaries: true
          aqtsource: aqtinstall
          aqtversion: "==3.2.*"
          set-env: false
          setup-python: true
        continue-on-error: true
      - name: Assert action ran with aqtsource input
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran with aqtsource input"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
