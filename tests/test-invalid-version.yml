name: Test invalid Qt version fails
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          version: "1.2.3"
          dir: ${{ runner.temp }}/qt-invalid
          install-deps: "false"
      - name: Assert action failed
        env:
          OUTCOME: ${{ steps.action.outcome }}
          ROOT: ${{ steps.action.outputs.qt-root-dir }}
        run: |
          echo "outcome=$OUTCOME root=$ROOT"
          [ "$OUTCOME" = "failure" ] || { echo "FAIL: expected failure"; exit 1; }
          [ -z "$ROOT" ] || { echo "FAIL: qt-root-dir should be empty"; exit 1; }
          echo "PASS"
