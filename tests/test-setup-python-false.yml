name: Test setup-python false
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      RUNNER_WORKSPACE: /tmp/qt-workspace
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Ensure python3 is available
        run: |
          python3 --version
          python3 -m pip install --upgrade pip

      - name: Run action with setup-python disabled
        id: action
        uses: .
        with:
          version: "6.8.3"
          target: desktop
          dir: /tmp/qt-workspace/Qt
          no-qt-binaries: "true"
          set-env: "false"
          install-deps: "false"
          setup-python: "false"

      - name: Assert action completed without error
        run: |
          echo "Action completed successfully with setup-python=false"
          echo "PASS"
