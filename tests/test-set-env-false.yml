name: Test set-env false mode
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      RUNNER_WORKSPACE: /tmp/qt-workspace
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with set-env disabled
        id: action
        uses: .
        with:
          version: "6.8.3"
          target: desktop
          dir: /tmp/qt-workspace/Qt
          no-qt-binaries: "true"
          set-env: "false"
          install-deps: "false"
          setup-python: "true"

      - name: Assert Qt_DIR is not set
        run: |
          echo "Qt_DIR value: '${Qt_DIR:-}'"
          echo "QT_ROOT_DIR value: '${QT_ROOT_DIR:-}'"
          if [ -n "${Qt_DIR:-}" ]; then
            echo "FAIL: Qt_DIR should not be set when set-env is false"
            exit 1
          fi
          if [ -n "${QT_ROOT_DIR:-}" ]; then
            echo "FAIL: QT_ROOT_DIR should not be set when set-env is false"
            exit 1
          fi
          echo "PASS: Qt env vars are not set as expected"
