name: Test Qt installation with additional modules
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: install-qt
        uses: .
        with:
          version: "6.7.3"
          host: linux
          target: desktop
          dir: "/tmp/qt-with-modules"
          modules: "qtcharts"
          install-deps: "true"
          set-env: "true"
          cache: "false"
          setup-python: "false"
          archives: "qtbase icu"

      - name: Assert Qt is installed with modules
        run: |
          echo "QT_ROOT_DIR: $QT_ROOT_DIR"
          if [ -z "$QT_ROOT_DIR" ]; then
            echo "FAIL: QT_ROOT_DIR environment variable is not set"
            exit 1
          fi
          if [ ! -d "$QT_ROOT_DIR" ]; then
            echo "FAIL: QT_ROOT_DIR directory does not exist: $QT_ROOT_DIR"
            exit 1
          fi
          echo "PASS: Qt installed at $QT_ROOT_DIR"

      - name: Assert qtcharts module is installed
        run: |
          # Check that the qtcharts module files are present
          CHARTS_HEADER="$QT_ROOT_DIR/include/QtCharts/qchart.h"
          echo "Looking for: $CHARTS_HEADER"
          if [ ! -f "$CHARTS_HEADER" ]; then
            echo "FAIL: QtCharts header not found at $CHARTS_HEADER"
            exit 1
          fi
          echo "PASS: QtCharts module is installed"
